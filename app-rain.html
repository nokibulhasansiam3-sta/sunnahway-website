<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Rain · Sunnahway</title>
<style>*{box-sizing:border-box}body{margin:0;background:#091410;color:#edf5f1;font:16px system-ui}main{width:min(100% - 32px,640px);margin:32px auto}h1{font-weight:500}p{color:#a9beb5}video{display:block;width:100%;height:65vh;object-fit:cover;border-radius:24px;background:#10201a}audio{width:100%;margin-top:20px}button{margin-top:16px;padding:14px 24px;border:0;border-radius:28px;background:#79c9b5;color:#091410;font:inherit;cursor:pointer}</style></head>
<body><main><h1>A moment of rain</h1><p>Rest, listen, and unwind.</p><video id="rain" muted loop playsinline preload="metadata" src="/media/rain-background-v1.mp4"></video><audio id="sound" controls loop preload="metadata" src="/media/rain-storm-v1.m4a"></audio><button id="toggle">Play rain</button><p id="status" role="status"></p></main>
<script>const v=document.querySelector('#rain'),a=document.querySelector('#sound'),b=document.querySelector('#toggle'),s=document.querySelector('#status');b.onclick=async()=>{if(!a.paused){a.pause();return}try{await a.play()}catch(e){s.textContent='Could not play. Please try again.'}};a.onplay=()=>{b.textContent='Pause rain';v.play().catch(()=>s.textContent='Video unavailable; audio continues.')};a.onpause=()=>{b.textContent='Play rain';v.pause()};</script></body></html>
